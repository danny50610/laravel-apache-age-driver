services:
  devcontainer:
    build:
      context: workspace
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached

  db:
    image: apache/age:release_PG15_1.5.0
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      # Host port comes from .devcontainer/.env (see .env.example).
      - "127.0.0.1:${DB_HOST_PORT:-54323}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
